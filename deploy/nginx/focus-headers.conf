# 专注学习站 · 安全响应头片段
# nginx 的 add_header 不继承：location 里只要出现 add_header，server 级的就失效，
# 所以每个带 add_header 的 location 都要 include 一次本片段。
#
# script-src 里的 sha256 哈希由部署脚本按构建产物现算（见 scripts/render_prod_conf.py），
# 放行 Nuxt 那个内联的配置脚本，不用 unsafe-inline。

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' __CSP_SCRIPT_HASHES__ https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
